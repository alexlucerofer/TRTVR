name: Landing page + demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['site/**', 'demo/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # landing page na raiz e a "internet simulada" (vagas fake, Mural, RedePro, panfletos) em /demo
      - run: mkdir -p _site && cp -r site/. _site/ && cp -r demo _site/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
