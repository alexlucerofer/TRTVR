<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>ELO — Configuração</title>
<style>
  body{font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#101828}
  label{display:block;font-weight:600;margin-top:14px} input{width:100%;padding:9px;border:1px solid #d0d5dd;border-radius:8px;font:inherit}
  button{margin-top:16px;padding:9px 14px;border-radius:8px;border:0;background:#101828;color:#fff;font:600 14px system-ui;cursor:pointer}
  .muted{color:#667085;font-size:13px} #out{margin-top:14px;white-space:pre-wrap}
</style></head>
<body>
  <h1>Conectar ao Supabase</h1>
  <p class="muted">Use a <b>URL do projeto</b> e a chave <b>anon/publishable</b> (Project Settings → API). Ela é pública por definição. <b>Nunca</b> cole a service role aqui.</p>
  <label for="url">URL do projeto</label><input id="url" placeholder="https://xxxx.supabase.co">
  <label for="key">Chave anon / publishable</label><input id="key" placeholder="sb_publishable_… ou eyJ…">
  <button id="save" type="button">Salvar e testar conexão</button>
  <div id="out" class="muted"></div>
  <script src="options.js"></script>
</body></html>
